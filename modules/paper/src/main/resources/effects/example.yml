# Effects: particles and sounds on a timeline. Every top-level section is one effect, played as
# hyperion:<section>. Try one with /hy effect play hyperion:level_up while you look at a model.
#
# An effect lasts "duration" ticks (20 a second) and has parts. Each part has a type:
#   particle  An emitter: sends its shape of particles every "every" ticks while visible.
#   sound     Plays a sound at each keyframe.
#   burst     Sends a burst of particles at each keyframe.
#   event     Fires an event plugins listen to at each keyframe, with the keyframe's "name".
#   text, item, block  A prop in the air: rotation, scale and offset move between keyframes.
#   model     A Hyperion model as a prop, playing its "animation".
#   title, actionbar, message  Text on each viewer's screen, in MiniMessage, at each keyframe.
#   command   A console command at each keyframe, %player% for each viewer. Never in models.
#   time      Each viewer's own sky time; put back when the effect ends.
#   camera    Moves the view of the players a play names. Try: /hy effect play showcase --camera
#
# Keyframes sit at ticks. Numbers and [x, y, z] values move smoothly from one keyframe to the
# next, eased by the later one's "easing": linear, ease-in, ease-out, ease-in-out, ease-in-back,
# ease-out-back or ease-out-bounce. A particle part waits for its first keyframe.
#
# Where a part is:
#   at: anchor          where the effect is played (the default)
#   at: bone:<name>     a bone of the model, turning with it
#   at: locator:<name>  a Blockbench locator of the model, turning with it
#   at: <part>          another part, such as an emitter that moves
#   offset: [right, up, forward]  blocks from there
#
# Any part can be "heavy: true": players with the permission hyperion.effects.reduced, or who a
# plugin says want fewer effects, go without it. Props (text, item, block) can "bob": blocks to
# rise and fall, over "bob-period" ticks. A text's background fades with "alpha" (0 to 1) and
# breathes with "pulse", a period in ticks.
#
# For an effect that is one player's own moment, such as a crate they open:
#   reveal: <tick>         when it shows the prize; whoever played it can wait for that
#   hide-players: <blocks> other players this close are hidden from its viewers meanwhile
#   ambient: true          plays beside the player's own effect in place of taking its turn
# Try: /hy effect play crate --here --own
#
# Who sees it: viewers: model (who sees the model, the default), everyone, or nearby:<radius>.
# Parameters, written %name%, can be filled in by whoever plays the effect. With PlaceholderAPI,
# titles, action bars, messages and commands also fill in its placeholders for each viewer, and
# text props the server's own, such as %server_online%.

level_up:
  duration: 40
  parts:
    spiral:
      type: particle
      particle: END_ROD
      shape: helix
      count: 12
      radius: 0.8
      height: 2.2
      every: 2
      keyframes:
        0: { radius: 0.2 }
        20: { radius: 1.0, easing: ease-out }
        36: { radius: 0.3, easing: ease-in }
        38: { visible: false }

    chime:
      type: sound
      keyframes:
        0: { sound: block.amethyst_block.chime, pitch: 1.2 }
        20: { sound: entity.player.levelup, volume: 0.8, pitch: 1.4 }

    pop:
      type: burst
      offset: [0, 2.2, 0]
      keyframes:
        36: { particle: TOTEM_OF_UNDYING, count: 30, spread: 0.4, speed: 0.3 }

smoke_puff:
  duration: 10
  parts:
    puff:
      type: burst
      offset: [0, 0.5, 0]
      keyframes:
        0: { particle: CAMPFIRE_COSY_SMOKE, count: 8, spread: 0.3, speed: 0.02 }
        4: { particle: POOF, count: 12, spread: 0.4, speed: 0.05 }

    hiss:
      type: sound
      keyframes:
        0: { sound: block.fire.extinguish, volume: 0.6, pitch: 1.3 }

aura:
  duration: 40
  loop: true
  parameters:
    color: "#7FD4FF"
  parts:
    ring:
      type: particle
      particle: DUST
      color: "%color%"
      size: 1.2
      shape: ring
      count: 16
      spin: 0.1
      every: 2
      keyframes:
        0: { offset: [0, 0.1, 0], radius: 0.9 }
        20: { offset: [0, 0.6, 0], radius: 1.1, easing: ease-in-out }
        40: { offset: [0, 0.1, 0], radius: 0.9, easing: ease-in-out }

# A breath from a model's mouth. Give your model a locator named "mouth", or change the "at".
fire_breath:
  duration: 40
  viewers: nearby:32
  parts:
    flames:
      type: particle
      at: locator:mouth
      particle: FLAME
      count: 4
      every: 1
      direction: [0, -0.1, 1]
      speed: 0.35
      keyframes:
        0: { visible: false }
        8: { visible: true }
        34: { visible: false }

    roar:
      type: sound
      at: locator:mouth
      keyframes:
        0: { sound: entity.ender_dragon.growl, volume: 1.2, pitch: 0.8 }
        8: { sound: item.firecharge.use, category: hostile }

    hit:
      type: event
      keyframes:
        12: { name: breath_damage }

# A small scene: a gem rises with its name, a title, and a camera that circles it.
showcase:
  duration: 100
  parameters:
    name: "<gradient:#7FD4FF:#C77DFF>Starlight Gem</gradient>"
  parts:
    gem:
      type: item
      item: amethyst_shard
      glow-color: "#C77DFF"
      keyframes:
        0: { offset: [0, 1, 3], scale: 0 }
        20: { offset: [0, 1.6, 3], scale: 1.2, easing: ease-out-back }
        90: { rotation: [0, 720, 0] }
        96: { scale: 0, easing: ease-in }

    label:
      type: text
      text: "%name%"
      billboard: center
      shadow: true
      background: "#00000000"
      keyframes:
        10: { offset: [0, 2.4, 3], scale: 0 }
        24: { scale: 1.2, easing: ease-out }
        92: { scale: 0, easing: ease-in }

    banner:
      type: title
      keyframes:
        20: { title: "%name%", subtitle: "<gray>found by %player%", fade: [10, 50, 15] }

    shine:
      type: sound
      keyframes:
        20: { sound: block.amethyst_block.resonate, pitch: 1.4 }

    shot:
      type: camera
      skippable: true
      look: gem
      keyframes:
        0: { offset: [-3, 2.5, 0] }
        50: { offset: [0, 2.2, 6], easing: ease-in-out }
        96: { offset: [3, 2.5, 0], easing: ease-in-out }

# A crate opening: the prize rises out of the spot, turns, and is named at tick 30.
crate:
  duration: 80
  viewers: nearby:24
  reveal: 30
  hide-players: 3
  parameters:
    prize: DIAMOND
    name: "<aqua>Diamond"
  parts:
    prize:
      type: item
      item: "%prize%"
      bob: 0.15
      bob-period: 30
      keyframes:
        0: { offset: [0, 0.4, 0], scale: 0, rotation: [0, 0, 0] }
        30: { offset: [0, 1.6, 0], scale: 1, rotation: [0, 360, 0], easing: ease-out-back }
        70: { scale: 1, rotation: [0, 540, 0] }
        80: { scale: 0, easing: ease-in }

    label:
      type: text
      text: "%name%"
      billboard: center
      background: "#A0101018"
      pulse: 30
      offset: [0, 2.3, 0]
      keyframes:
        0: { visible: false }
        30: { visible: true, alpha: 0, scale: 0.6 }
        40: { alpha: 1, scale: 1, easing: ease-out }
        70: { alpha: 1 }
        80: { alpha: 0 }

    sparks:
      type: particle
      heavy: true
      particle: END_ROD
      shape: ring
      count: 10
      every: 2
      offset: [0, 0.3, 0]
      keyframes:
        0: { radius: 0.3 }
        30: { radius: 1.2, easing: ease-out }
        32: { visible: false }

    sounds:
      type: sound
      keyframes:
        0: { sound: block.chest.open, pitch: 0.8 }
        30: { sound: entity.player.levelup, pitch: 1.3 }
