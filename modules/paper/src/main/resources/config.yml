# Hyperion's settings. /hy reload reads this file again.
#
# Keys Hyperion adds in an update are written into this file on the next start; your changes stay.

# Live models. A plugin that spawns a model can give it its own values.
models:
  # How far away, in blocks, players see a model.
  view-distance: 48
  # Over how many ticks a player's client smooths each move of a bone. 0 snaps every move;
  # higher is smoother but trails behind.
  interpolation: 2

  # The mob /hy spawn puts a model on, so it walks around and plays its idle and walk
  # animations. The mob is hidden, silent and gone after a restart. /hy spawn --static places
  # a model that stands still instead.
  spawn-entity: pig

  # Models on entities play these animations by themselves, when they have them: idle while
  # the entity stands still, walk while it moves. A plugin can turn this off per model.
  auto-animations:
    enabled: true
    idle: idle
    walk: walk
    # A choice per entity type that wins over "enabled", such as armor_stand: false.
    entities: {}

# What bones do, picked by how their names start in Blockbench. Changes reach models spawned
# after /hy reload.
behaviors:
  # The name starts that give a bone each behavior, ignoring case. Add the names another plugin
  # uses to load its models as they are, such as h_ for head and p_ for seat.
  prefixes:
    # Turns with where the entity looks.
    head: [head]
    # A box players hit and click, sized by the bone's own cubes, which are not drawn.
    hitbox: [hitbox]
    # A spot a player can sit on, moving with the model.
    seat: [seat]
    # Shows the entity's name, following the bone.
    nametag: [nametag]
    # Shows what the entity holds in its main or off hand.
    main-hand: [main_hand]
    off-hand: [off_hand]
    # Never drawn: for bones that only hold others, locators or logic.
    ghost: [ghost]

  head:
    # How far a head turns left or right from the body, and up or down, in degrees.
    max-yaw: 50
    max-pitch: 40

  hitboxes:
    # How players hit and click models:
    #   bones  A hitbox per hitbox bone, following the bone. A model without hitbox bones gets
    #          one box around all of it.
    #   model  One box around the whole model.
    #   none   No hitbox: players click straight through the model.
    mode: bones
    # Hits on a model on an entity hurt the entity, as if the player hit it.
    forward-damage: true

  seats:
    # Right-clicking a model with a free seat sits the player in it. Sneak to get off.
    click-to-ride: true
    # The player in the first seat steers the entity carrying the model.
    steering:
      enabled: false
      # walking moves like a horse and jumps; flying follows where the rider looks.
      mode: walking
      # Blocks per tick: 0.25 is a little faster than a walking player.
      speed: 0.25
      # How high a jump goes, in blocks per tick upwards.
      jump: 0.5
      # A choice per entity type that wins over "enabled", such as horse: true.
      entities: {}

# Particles and sounds on a timeline, from plugins/Hyperion/effects, plugins and models.
effects:
  # How far away, in blocks, players see an effect that is not on a model. Effects on a model
  # go to the players who see the model.
  view-distance: 32
  # Scales every particle count: 0.5 halves them on a busy server, 0 sends none.
  particle-multiplier: 1.0

# /hy debug: bones, hitboxes, locators, seats and effects drawn for the player who asks.
debug:
  # Ticks between redraws. Higher draws less often and sends fewer particles.
  interval: 4
  # Bone, locator, seat and effect part names as floating text. Off for very busy models.
  labels: true
  # How long a bone's axes are, in blocks.
  axis-length: 0.4

# /hy gallery: every model and effect in a menu.
gallery:
  # How long a private preview stays before it goes, in seconds.
  preview-seconds: 120

# The resource pack that holds every model.
pack:
  # How players get the pack:
  #   self-host  Hyperion serves it from a small web server on this machine.
  #   url        You host the zip yourself: run /hy pack export, upload the file, put its link
  #              in "url". Upload it again after every change, or downloads fail.
  #   off        Hyperion sends nothing. Merge the exported zip into your own server pack.
  hosting: self-host

  self-host:
    # The port the web server listens on. Open it in your firewall.
    port: 8163
    # The address players download from. Empty uses the address each player joined with,
    # which is right unless the web server sits behind a different address.
    address: ""

  # The link to your uploaded zip, for hosting: url.
  url: ""

  # Offer the pack to players when they join.
  send-on-join: true
  # Kick players who decline the pack or fail to download it.
  required: false
  # Send the new pack to everyone online when a reload changes it.
  resend-on-change: true

  # The item every model part is shown as; players never see the item itself.
  # On 1.21 to 1.21.3 the models hang off this item's model file, so pick a flat item no other
  # pack changes, and only dyeable items such as leather_horse_armor can be tinted there.
  # From 1.21.4 any item works the same.
  base-item: paper
  # The first custom model data number Hyperion uses on 1.21 to 1.21.3.
  custom-model-data-start: 10000

# Bedrock players, through Geyser.
bedrock:
  # Show models to Bedrock players as native Bedrock entities. Needs Hyperion's Geyser extension,
  # hyperion-geyser, in Geyser's extensions folder, wherever Geyser runs. Without it, Bedrock
  # players see the plain mob a model rides.
  enabled: true
  # The port the Geyser extension connects to. Only the machine Geyser runs on needs to reach it.
  # The extension also needs the token in plugins/Hyperion/bedrock-token.txt.
  link-port: 8164
