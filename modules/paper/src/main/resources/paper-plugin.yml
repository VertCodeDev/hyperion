name: Hyperion
version: '${version}'
main: dev.vertcode.hyperion.HyperionPlugin
loader: dev.vertcode.hyperion.HyperionLoader
api-version: '1.21'
folia-supported: true
description: Animated Blockbench models for bosses, NPCs, pets and props, with the resource pack built for you.
authors: [VertCode Development]
website: https://github.com/VertCodeDev/hyperion

dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  hyperion.admin:
    description: Every Hyperion command.
    default: op
    children:
      hyperion.command.help: true
      hyperion.command.list: true
      hyperion.command.info: true
      hyperion.command.reload: true
      hyperion.command.validate: true
      hyperion.command.pack.build: true
      hyperion.command.pack.send: true
      hyperion.command.pack.status: true
      hyperion.command.pack.export: true
      hyperion.command.spawn: true
      hyperion.command.remove: true
      hyperion.command.animate: true
      hyperion.command.effect: true
      hyperion.menu: true
  hyperion.command.help:
    description: See the Hyperion help menu.
    default: op
  hyperion.command.list:
    description: List the loaded models.
    default: op
  hyperion.command.info:
    description: See everything about one model.
    default: op
  hyperion.command.reload:
    description: Load the models again.
    default: op
  hyperion.command.validate:
    description: See the warnings and errors from loading the models.
    default: op
  hyperion.command.pack.build:
    description: Build the resource pack again.
    default: op
  hyperion.command.pack.send:
    description: Offer the resource pack to players.
    default: op
  hyperion.command.pack.status:
    description: See how the resource pack is hosted and how players are doing with it.
    default: op
  hyperion.command.pack.export:
    description: Write the resource pack into the data folder.
    default: op
  hyperion.command.spawn:
    description: Spawn a model where you stand or put one on an entity.
    default: op
  hyperion.command.remove:
    description: List the models nearby and remove them.
    default: op
  hyperion.command.animate:
    description: Play and stop animations on the nearest model.
    default: op
  hyperion.command.effect:
    description: Play, stop and list effects.
    default: op
  hyperion.menu:
    description: Open a model's menu by sneaking and right-clicking it.
    default: op
